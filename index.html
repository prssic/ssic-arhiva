<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arhiva foto | SSIC</title>
<meta name="description" content="Arhiva de galerii foto SSIC - amintiri din evenimentele noastre.">
<link rel="icon" href="https://ssic.ro/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-base:#100b19; --c-surface:#180f24; --c-surface-elevated:#221631;
  --c-primary:#5a2f8a; --c-accent:#f5b027; --c-white:#ffffff; --c-white-off:#e9e2ef;
  --c-border:rgba(255,255,255,0.09); --c-border-med:rgba(255,255,255,0.22);
  --c-nav-bg:rgba(16,11,25,0.9);
  --font-main:"Jost",system-ui,sans-serif;
  --font-display:"IBM Plex Sans",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-main);background-color:var(--c-base);color:var(--c-white-off);min-height:100vh;
  background-image:
    repeating-linear-gradient(90deg, rgba(140,90,190,0.07) 0px, rgba(140,90,190,0.07) 1.5px, transparent 1.5px, transparent 64px),
    repeating-linear-gradient(0deg, rgba(140,90,190,0.07) 0px, rgba(140,90,190,0.07) 1.5px, transparent 1.5px, transparent 64px),
    repeating-linear-gradient(90deg, rgba(140,90,190,0.06) 0px, rgba(140,90,190,0.06) 1px, transparent 1px, transparent 16px),
    repeating-linear-gradient(0deg, rgba(140,90,190,0.06) 0px, rgba(140,90,190,0.06) 1px, transparent 1px, transparent 16px);
  background-repeat:repeat;background-size:64px 64px, 64px 64px, 16px 16px, 16px 16px;background-attachment:fixed;
}
a{color:inherit}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:70px;display:flex;align-items:center;padding:0 5vw;gap:20px;
  background:var(--c-nav-bg);backdrop-filter:blur(14px) saturate(2);border-bottom:1px solid var(--c-border)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.1rem;font-family:var(--font-display);color:var(--c-white)}
.nav-logo img{width:32px;height:32px;border-radius:6px}
.nav-sp{flex:1}
.nav-link{text-decoration:none;font-weight:500;font-size:.9rem;opacity:.7;transition:opacity .15s}
.nav-link:hover{opacity:1;color:var(--c-accent)}
.wrap{max-width:1280px;margin:0 auto;padding:120px 5vw 80px}
.page-title{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,6vw,4rem);letter-spacing:-.02em;line-height:1.05;margin-bottom:10px;color:var(--c-white)}
.page-sub{font-size:1.1rem;opacity:.6;margin-bottom:50px}
.gi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.gi-card{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px var(--c-border);background:var(--c-surface);text-decoration:none;color:inherit;
  transition:transform .2s,box-shadow .2s,background .2s}
.gi-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px var(--c-border-med);background:var(--c-surface-elevated)}
.gi-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--c-surface-elevated);display:block}
.gi-thumb-ph{width:100%;aspect-ratio:4/3;background:var(--c-surface-elevated);display:flex;align-items:center;justify-content:center;opacity:.3}
.gi-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:8px}
.gi-title{font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.2;color:var(--c-white)}
.gi-meta{font-size:.9rem;opacity:.6;display:flex;gap:12px;flex-wrap:wrap}
.gi-count{margin-top:auto;padding-top:12px;font-size:.85rem;font-weight:600;opacity:.5;text-transform:uppercase;letter-spacing:.05em}
.gi-empty{text-align:center;padding:80px 20px;opacity:.35;font-size:1.1rem}
.gx-back{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;margin:0 8px 24px 0;
  background:rgba(255,255,255,0.06);color:var(--c-white);text-decoration:none;font:500 .95rem var(--font-main);
  border-radius:999px;box-shadow:0 0 0 1px var(--c-border);transition:background .15s,box-shadow .15s}
.gx-back:hover{box-shadow:0 0 0 1px var(--c-border-med);background:rgba(255,255,255,0.1)}
.gx-back svg,.gx-btn svg,.gx-dl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gx-title{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,5vw,3.5rem);letter-spacing:-.02em;line-height:1.05;margin-bottom:16px;color:var(--c-white)}
.gx-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:32px}
.gx-chip{padding:6px 14px;background:rgba(255,255,255,0.06);border-radius:999px;font-weight:500;font-size:.9rem;box-shadow:0 0 0 1px var(--c-border)}
.gx-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--c-accent);color:#000;
  border:0;cursor:pointer;font:600 .95rem var(--font-main);border-radius:10px;text-decoration:none;transition:filter .15s,transform .1s}
.gx-btn:hover{filter:brightness(1.1);transform:scale(1.02)}
.gx-desc{max-width:65ch;margin-bottom:32px;font-size:1.05rem;line-height:1.6;opacity:.8}
.gx-grid{columns:4 240px;column-gap:16px}
.gx-item{position:relative;break-inside:avoid;margin:0 0 16px;background:var(--c-surface-elevated);border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px var(--c-border);transition:transform .2s,box-shadow .2s}
.gx-item:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px var(--c-border-med)}
.gx-open{display:block;width:100%;padding:0;margin:0;background:transparent;border:0;cursor:zoom-in;aspect-ratio:var(--w)/var(--h)}
.gx-open img{display:block;width:100%;height:100%;object-fit:cover;background:var(--c-surface-elevated)}
.gx-dl{position:absolute;right:8px;bottom:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:rgba(16,11,25,0.7);color:var(--c-white);border-radius:9px;text-decoration:none;transition:background .15s,transform .1s}
.gx-dl:hover{background:var(--c-primary);transform:scale(1.05)}
.lb{position:fixed;inset:0;z-index:9999;display:none;background:rgba(16,11,25,.96);touch-action:pan-y}
.lb.open{display:block}
.lb-stage{position:absolute;inset:70px 10px 10px;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-bar{position:absolute;top:0;left:0;right:0;height:70px;display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--c-white);font-weight:500}
.lb-bar .sp{flex:1}
.lb button,.lb a.lb-dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 16px;
  background:rgba(255,255,255,.08);color:var(--c-white);border:0;border-radius:10px;cursor:pointer;
  font:500 .9rem var(--font-main);text-decoration:none;transition:background .15s}
.lb button:hover,.lb a.lb-dl:hover{background:rgba(255,255,255,.16)}
.lb a.lb-dl{background:var(--c-primary)}.lb a.lb-dl:hover{background:var(--c-primary-light)}
.lb .lb-nav{position:absolute;top:50%;margin-top:-22px;z-index:2}
.lb .lb-prev{left:10px}.lb .lb-next{right:10px}
@media(max-width:600px){.gx-grid{columns:2 140px;column-gap:12px}.gx-item{margin-bottom:12px}.lb-dl-label{display:none}}
</style></head><body>
<nav class="nav">
  <a class="nav-logo" href="/"><img src="https://ssic.ro/assets/logo/favicon.png" alt="SSIC logo">SSIC</a>
  <span class="nav-sp"></span>
  <a class="nav-link" href="/">Toate galeriile</a>
  <a class="nav-link" href="https://ssic.ro" target="_blank" rel="noopener">ssic.ro &#8599;</a>
</nav>
<div class="wrap"><h1 class="page-title">Arhiva foto</h1><p class="page-sub">Amintiri din evenimentele SSIC.</p><div class="gi-empty">Nicio galerie inca. Reveniti curand!</div></div><footer style="text-align:center;padding:60px 20px 40px;opacity:.4;font-size:.85rem">
  &copy; SSIC &mdash; Societatea Studentilor in Inginerie Chimica si Biotehnologii
</footer>
</body></html>
