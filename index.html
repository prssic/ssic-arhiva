<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arhiva foto | SSIC</title>
<meta name="description" content="Arhiva de galerii foto SSIC - amintiri din evenimentele noastre.">
<link rel="icon" href="https://ssic.ro/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c2340;--cream:#f5f4e0;--accent:#6d28d9;--line:rgba(245,244,224,.13);--soft:rgba(245,244,224,.07)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;background:var(--navy);color:var(--cream);min-height:100vh}
a{color:inherit}
/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:70px;display:flex;align-items:center;padding:0 5vw;gap:20px;
  background:rgba(12,35,64,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.nav-logo img{width:36px;height:36px;border-radius:8px}
.nav-sp{flex:1}
.nav-link{text-decoration:none;font-weight:600;font-size:.9rem;opacity:.7;transition:opacity .15s}
.nav-link:hover{opacity:1}
/* wrap */
.wrap{max-width:1280px;margin:0 auto;padding:100px 5vw 80px}
/* heading */
.page-title{font-weight:800;font-size:clamp(2rem,6vw,3.8rem);letter-spacing:-.03em;line-height:1.05;margin-bottom:10px}
.page-sub{font-size:1.05rem;opacity:.55;margin-bottom:48px}
/* grid galerii */
.gi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.gi-card{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line);background:var(--soft);text-decoration:none;color:inherit;
  transition:transform .2s,box-shadow .2s}
.gi-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px var(--line)}
.gi-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft);display:block}
.gi-thumb-ph{width:100%;aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;opacity:.3}
.gi-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;gap:6px}
.gi-title{font-weight:700;font-size:1.1rem;line-height:1.3}
.gi-meta{font-size:.88rem;opacity:.5;display:flex;gap:12px;flex-wrap:wrap}
.gi-count{margin-top:auto;padding-top:10px;font-size:.88rem;font-weight:600;opacity:.5}
.gi-empty{text-align:center;padding:80px 20px;opacity:.35;font-size:1.05rem}
/* grid foto */
.gx-back{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 11px;margin:0 8px 28px 0;
  background:var(--soft);color:inherit;text-decoration:none;font:600 .95rem 'DM Sans',sans-serif;
  border-radius:999px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.gx-back:hover{box-shadow:0 0 0 1px var(--cream)}
.gx-back svg,.gx-btn svg,.gx-dl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gx-title{font-weight:800;font-size:clamp(1.8rem,5vw,3.5rem);letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
.gx-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:30px}
.gx-chip{padding:7px 14px;background:var(--soft);border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:0 0 0 1px var(--line)}
.gx-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--accent);color:#fff;
  border:0;cursor:pointer;font:700 .95rem 'DM Sans',sans-serif;border-radius:10px;text-decoration:none;transition:filter .15s}
.gx-btn:hover{filter:brightness(1.12)}
.gx-desc{max-width:60ch;margin-bottom:28px;font-size:1rem;line-height:1.6;opacity:.75}
.gx-grid{columns:4 240px;column-gap:16px}
.gx-item{position:relative;break-inside:avoid;margin:0 0 16px;background:var(--soft);border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line);transition:transform .2s}
.gx-item:hover{transform:translateY(-2px)}
.gx-open{display:block;width:100%;padding:0;margin:0;background:transparent;border:0;cursor:zoom-in;
  aspect-ratio:var(--w)/var(--h)}
.gx-open img{display:block;width:100%;height:100%;object-fit:cover;background:var(--soft)}
.gx-dl{position:absolute;right:8px;bottom:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);color:#fff;border-radius:9px;text-decoration:none;transition:background .15s}
.gx-dl:hover{background:var(--accent)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:9999;display:none;background:rgba(4,8,16,.96);touch-action:pan-y}
.lb.open{display:block}
.lb-stage{position:absolute;inset:64px 10px 10px;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-bar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;font-weight:700}
.lb-bar .sp{flex:1}
.lb button,.lb a.lb-dl{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;
  background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:10px;cursor:pointer;
  font:700 .9rem 'DM Sans',sans-serif;text-decoration:none;transition:background .15s}
.lb button:hover,.lb a.lb-dl:hover{background:rgba(255,255,255,.25)}
.lb a.lb-dl{background:var(--accent)}.lb a.lb-dl:hover{filter:brightness(1.1);background:var(--accent)}
.lb .lb-nav{position:absolute;top:50%;margin-top:-22px;z-index:2}
.lb .lb-prev{left:10px}.lb .lb-next{right:10px}
@media(max-width:600px){.gx-grid{columns:2 130px;column-gap:10px}.gx-item{margin-bottom:10px}.lb-dl-label{display:none}}
</style></head><body>
<nav class="nav">
  <a class="nav-logo" href="/">
    <img src="https://ssic.ro/assets/logo/favicon.png" alt="SSIC">
    SSIC
  </a>
  <span class="nav-sp"></span>
  <a class="nav-link" href="/">Toate galeriile</a>
  <a class="nav-link" href="https://ssic.ro" target="_blank" rel="noopener">ssic.ro ↗</a>
</nav>
<div class="wrap"><h1 class="page-title">Arhiva foto</h1><p class="page-sub">Amintiri din evenimentele SSIC.</p><div class="gi-empty">Nicio galerie inca. Reveniti curand!</div></div>
<footer style="text-align:center;padding:40px 20px;opacity:.3;font-size:.85rem">
  &copy; SSIC &mdash; Societatea Studentilor in Inginerie Chimica si Biotehnologii
</footer>
</body></html>
